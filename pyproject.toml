[project]
name = "california-hospital-seismic-risk"
version = "0.1.0"
description = "California hospital building data integration and seismic risk analysis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=18",
]

[project.scripts]
build-integrated-data = "california_seismic.pipeline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/california_seismic"]

[dependency-groups]
notebook = [
    "ipykernel>=6,<8",
    "jupyterlab>=4,<5",
]
